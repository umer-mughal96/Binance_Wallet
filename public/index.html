  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
  <script>
    $(document).ready(function () {
      (function ($) {
        $.fn.mySelectDropdown = function (options) {
          return this.each(function () {
            var $this = $(this);

            $this.each(function () {
              var dropdown = $("<div />").addClass("f-dropdown selectDropdown");

              $(this).wrap(dropdown);

              var label = $("<span />")
                .text($(this).attr("placeholder"))
                .insertAfter($(this));
              var list = $("<ul />");

              $(this)
                .find("option")
                .each(function () {
                  var image = $(this).data("image");
                  if (image) {
                    list.append(
                      $("<li />").append(
                        $("<a />")
                          .text($(this).text())
                          .prepend('<img src="' + image + '">')
                      )
                    );
                  } else if ($(this).val() != "") {
                    list.append($("<li />").append($("<a />").text($(this).text())));
                  }
                });

              list.insertAfter($(this));

              if (
                $(this).find("option:selected").length > 0 &&
                $(this).find("option:selected").val() != ""
              ) {
                list
                  .find("li:contains(" + $(this).find("option:selected").text() + ")")
                  .addClass("active");
                $(this).parent().addClass("filled");
                label.html(list.find("li.active a").html());
              }
            });

            $(this)
              .parent()
              .on("click", "ul li a", function (e) {
                e.preventDefault();
                var dropdown = $(this).parent().parent().parent();
                var active = $(this).parent().hasClass("active");
                var label = active
                  ? dropdown.find("select").attr("placeholder")
                  : $(this).html();

                dropdown.find("option").prop("selected", false);
                dropdown.find("ul li").removeClass("active");

                dropdown.toggleClass("filled", !active);
                dropdown.children("span").html(label);

                if (!active) {
                  dropdown
                    .find("option:contains(" + $(this).text() + ")")
                    .prop("selected", true);
                  $(this).parent().addClass("active");
                }

                dropdown.removeClass("open");
              });

            $this.parent().on("click", "> span", function (e) {
              var self = $(this).parent();
              self.toggleClass("open");
            });

            $(document).on("click touchstart", function (e) {
              var dropdown = $this.parent();
              if (dropdown !== e.target && !dropdown.has(e.target).length) {
                dropdown.removeClass("open");
              }
            });
          });
        };
      })(jQuery);

      $("select.f-dropdown").mySelectDropdown();

    });
  </script>
</body>
